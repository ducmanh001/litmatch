name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NX_TUI: 'false'
  JWT_SECRET: ci-only-secret-0123456789abcdef-xyz
  AUTH_OTP_PEPPER: ci-only-pepper-0123456789
  DATABASE_URL: postgresql://litmatch:litmatch_local@localhost:5432/litmatch
  REDIS_URL: redis://localhost:6379/15
  # Browser E2E gọi core-api cross-origin; thiếu CORS_ORIGINS thì preflight bị deny.
  CORS_ORIGINS: http://localhost:4200,http://localhost:4300
  NEXT_PUBLIC_API_URL: http://localhost:3000
  NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
  NEXT_PUBLIC_LIVEKIT_URL: ws://localhost:7880

jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Local-equivalent quality preflight
        env:
          AGENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm ci:local:quick

  test:
    name: Test, build and E2E
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: litmatch
          POSTGRES_PASSWORD: litmatch_local
          POSTGRES_DB: litmatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U litmatch"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      INTEGRATION_DB_URL: postgresql://litmatch:litmatch_local@localhost:5432/litmatch_test
      LOCAL_CI_DATABASE_URL: postgresql://litmatch:litmatch_local@localhost:5432/litmatch
      LOCAL_CI_REDIS_URL: redis://localhost:6379/15
      LOCAL_CI_INTEGRATION_DB_URL: postgresql://litmatch:litmatch_local@localhost:5432/litmatch_test
      LOCAL_CI_SERVICES_READY: 'true'
      LOCAL_CI_DATABASE_READY: 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create integration database
        run: |
          postgres_container="$(docker ps --filter ancestor=postgres:16-alpine --format '{{.ID}}' | head -n 1)"
          test -n "${postgres_container}"
          database_exists="$(docker exec "${postgres_container}" psql --username litmatch --dbname postgres --tuples-only --no-align --command "SELECT 1 FROM pg_database WHERE datname = 'litmatch_test'")"
          if [[ "${database_exists}" != 1 ]]; then
            docker exec "${postgres_container}" psql --username litmatch --dbname postgres --command 'CREATE DATABASE litmatch_test'
          fi
      - name: Local-equivalent test and build preflight
        env:
          AGENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm ci:local

  docker:
    name: Container build and runtime smoke
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: litmatch
          POSTGRES_PASSWORD: litmatch_local
          POSTGRES_DB: litmatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U litmatch"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      LOCAL_CI_DATABASE_URL: postgresql://litmatch:litmatch_local@localhost:5432/litmatch
      LOCAL_CI_REDIS_URL: redis://localhost:6379/15
      LOCAL_CI_SERVICES_READY: 'true'
      LOCAL_CI_DATABASE_READY: 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Local-equivalent container preflight
        run: pnpm ci:local:docker

  required:
    name: CI required
    if: always()
    needs: [quality, test, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI stage
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          if [[ "${QUALITY_RESULT}" != success \
            || "${TEST_RESULT}" != success \
            || "${DOCKER_RESULT}" != success ]]; then
            echo "::error::CI incomplete: quality=${QUALITY_RESULT}, test=${TEST_RESULT}, docker=${DOCKER_RESULT}"
            exit 1
          fi
