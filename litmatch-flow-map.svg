<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1220" viewBox="0 0 1900 1220" role="img" aria-labelledby="title desc">
  <title id="title">Litmatch UI flow map</title>
  <desc id="desc">Sơ đồ UI từ người dùng, đăng nhập, App Shell, các màn hình, API, database, realtime, Sentry và Grafana.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111518"/>
      <stop offset="1" stop-color="#1a1d20"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef4868"/>
      <stop offset="1" stop-color="#ff8a9d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#64727a"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#ff5f72"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, Segoe UI, Arial, sans-serif; fill: #f4f7f8; }
      .subtitle { font: 400 14px Inter, Segoe UI, Arial, sans-serif; fill: #8e9ba2; }
      .label { font: 700 14px Inter, Segoe UI, Arial, sans-serif; fill: #dce7eb; }
      .small { font: 500 11px Inter, Segoe UI, Arial, sans-serif; fill: #aebbc0; }
      .tiny { font: 500 10px Inter, Segoe UI, Arial, sans-serif; fill: #91a0a7; }
      .screen { fill: #0b3553; stroke: #12608c; stroke-width: 1; }
      .api { fill: #332b57; stroke: #6652a2; stroke-width: 1; }
      .data { fill: #153e43; stroke: #2b888a; stroke-width: 1; }
      .infra { fill: #3b303d; stroke: #886074; stroke-width: 1; }
      .warn { fill: #542b32; stroke: #ff5f72; stroke-width: 1.5; }
      .card { rx: 12; filter: url(#shadow); }
      .line { fill: none; stroke: #5e6b72; stroke-width: 1.4; marker-end: url(#arrow); }
      .lineSoft { fill: none; stroke: #46545b; stroke-width: 1.1; stroke-dasharray: 5 5; marker-end: url(#arrow); }
      .lineRed { fill: none; stroke: #ff5f72; stroke-width: 1.8; marker-end: url(#arrowRed); }
      .divider { stroke: #2d383d; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1900" height="1220" fill="url(#bg)"/>
  <text x="50" y="48" class="title">Litmatch — UI Flow Map</text>
  <text x="50" y="73" class="subtitle">Luồng màn hình, hành động, API, dữ liệu và trạng thái test runtime</text>

  <g transform="translate(1390 28)">
    <rect width="18" height="12" rx="4" class="screen"/><text x="26" y="11" class="small">Màn hình UI</text>
    <rect x="120" width="18" height="12" rx="4" class="api"/><text x="146" y="11" class="small">API</text>
    <rect x="205" width="18" height="12" rx="4" class="data"/><text x="231" y="11" class="small">DB/Realtime</text>
    <rect x="330" width="18" height="12" rx="4" class="warn"/><text x="356" y="11" class="small">Lỗi hiện tại</text>
  </g>

  <!-- Entry flow -->
  <g>
    <rect x="55" y="112" width="150" height="48" class="screen card"/>
    <text x="130" y="141" text-anchor="middle" class="label">Người dùng</text>
    <rect x="280" y="112" width="150" height="48" class="screen card"/>
    <text x="355" y="141" text-anchor="middle" class="label">Website Web</text>
    <rect x="505" y="112" width="150" height="48" class="screen card"/>
    <text x="580" y="141" text-anchor="middle" class="label">/login</text>
    <rect x="730" y="93" width="120" height="32" rx="16" class="screen"/>
    <text x="790" y="114" text-anchor="middle" class="small">Guest A</text>
    <rect x="730" y="137" width="120" height="32" rx="16" class="screen"/>
    <text x="790" y="158" text-anchor="middle" class="small">Guest B</text>
    <rect x="930" y="112" width="190" height="48" class="screen card"/>
    <text x="1025" y="141" text-anchor="middle" class="label">App Shell + AuthGate</text>
    <path d="M205 136 H280" class="line"/>
    <path d="M430 136 H505" class="line"/>
    <path d="M655 136 H720" class="line"/>
    <path d="M850 109 C880 109 880 126 930 126" class="line"/>
    <path d="M850 153 C880 153 880 146 930 146" class="line"/>
  </g>

  <text x="50" y="222" class="subtitle">APP SCREENS — các entry point người dùng có thể bấm từ Home hoặc bottom navigation</text>
  <path d="M1025 160 V205" class="line"/>
  <path d="M1025 205 H130" class="lineSoft"/>
  <path d="M1025 205 H1770" class="lineSoft"/>

  <!-- Screen nodes -->
  <g>
    <rect x="50" y="250" width="145" height="62" class="screen card"/><text x="122" y="277" text-anchor="middle" class="label">Home</text><text x="122" y="296" text-anchor="middle" class="small">hub / navigation</text>
    <rect x="220" y="250" width="145" height="62" class="screen card"/><text x="292" y="277" text-anchor="middle" class="label">Discovery</text><text x="292" y="296" text-anchor="middle" class="small">browse profiles</text>
    <rect x="390" y="250" width="145" height="62" class="screen card"/><text x="462" y="277" text-anchor="middle" class="label">Matching</text><text x="462" y="296" text-anchor="middle" class="small">Soul / Voice</text>
    <rect x="560" y="250" width="145" height="62" class="screen card"/><text x="632" y="277" text-anchor="middle" class="label">Party Room</text><text x="632" y="296" text-anchor="middle" class="small">room / chat / mic</text>
    <rect x="730" y="250" width="145" height="62" class="screen card"/><text x="802" y="277" text-anchor="middle" class="label">Feed</text><text x="802" y="296" text-anchor="middle" class="small">post / like / comment</text>
    <rect x="900" y="250" width="145" height="62" class="screen card"/><text x="972" y="277" text-anchor="middle" class="label">Friends / Chat</text><text x="972" y="296" text-anchor="middle" class="small">conversation</text>
    <rect x="1070" y="250" width="145" height="62" class="screen card"/><text x="1142" y="277" text-anchor="middle" class="label">Profile</text><text x="1142" y="296" text-anchor="middle" class="small">me / edit / privacy</text>
    <rect x="1240" y="250" width="145" height="62" class="screen card"/><text x="1312" y="277" text-anchor="middle" class="label">Video</text><text x="1312" y="296" text-anchor="middle" class="small">reel / gift</text>
    <rect x="1410" y="250" width="145" height="62" class="screen card"/><text x="1482" y="277" text-anchor="middle" class="label">Wallet</text><text x="1482" y="296" text-anchor="middle" class="small">Diamond / VIP</text>
    <rect x="1580" y="250" width="190" height="62" class="screen card"/><text x="1675" y="277" text-anchor="middle" class="label">More / Help / Privacy</text><text x="1675" y="296" text-anchor="middle" class="small">settings / support</text>
    <path d="M122 205 V250" class="lineSoft"/><path d="M292 205 V250" class="lineSoft"/><path d="M462 205 V250" class="lineSoft"/><path d="M632 205 V250" class="lineSoft"/><path d="M802 205 V250" class="lineSoft"/><path d="M972 205 V250" class="lineSoft"/><path d="M1142 205 V250" class="lineSoft"/><path d="M1312 205 V250" class="lineSoft"/><path d="M1482 205 V250" class="lineSoft"/><path d="M1675 205 V250" class="lineSoft"/>
  </g>

  <!-- Home action panel -->
  <g>
    <rect x="50" y="350" width="505" height="290" rx="16" fill="#151f27" stroke="#2b526b"/>
    <text x="75" y="382" class="label">HOME UI — action map</text>
    <text x="75" y="407" class="small">GET /users/me · wallet · unread notifications · trending rooms</text>
    <rect x="75" y="430" width="210" height="42" rx="10" fill="#0b3553" stroke="#12608c"/><text x="180" y="456" text-anchor="middle" class="small">Avatar / nickname → Profile</text>
    <rect x="310" y="430" width="210" height="42" rx="10" fill="#0b3553" stroke="#12608c"/><text x="415" y="456" text-anchor="middle" class="small">💎 balance → Wallet</text>
    <rect x="75" y="486" width="210" height="42" rx="10" fill="#0b3553" stroke="#12608c"/><text x="180" y="512" text-anchor="middle" class="small">Tìm quanh đây → Discovery</text>
    <rect x="310" y="486" width="210" height="42" rx="10" fill="#0b3553" stroke="#12608c"/><text x="415" y="512" text-anchor="middle" class="small">Voice Match → Matching</text>
    <rect x="75" y="542" width="210" height="42" rx="10" fill="#0b3553" stroke="#12608c"/><text x="180" y="568" text-anchor="middle" class="small">Party / Feed / Friends / Video</text>
    <rect x="310" y="542" width="210" height="42" rx="10" fill="#0b3553" stroke="#12608c"/><text x="415" y="568" text-anchor="middle" class="small">Soul / Movie / Palm Match</text>
    <path d="M122 312 V350" class="lineSoft"/>
  </g>

  <!-- API nodes -->
  <text x="610" y="382" class="subtitle">BACKEND API / REALTIME</text>
  <g>
    <rect x="610" y="405" width="170" height="56" class="api card"/><text x="695" y="430" text-anchor="middle" class="label">Auth / Session API</text><text x="695" y="448" text-anchor="middle" class="tiny">guest · refresh · csrf</text>
    <rect x="800" y="405" width="170" height="56" class="api card"/><text x="885" y="430" text-anchor="middle" class="label">Discovery API</text><text x="885" y="448" text-anchor="middle" class="tiny">browse · nearby</text>
    <rect x="990" y="405" width="170" height="56" class="api card"/><text x="1075" y="430" text-anchor="middle" class="label">Matching API</text><text x="1075" y="448" text-anchor="middle" class="tiny">tickets · sessions</text>
    <rect x="1180" y="405" width="170" height="56" class="api card"/><text x="1265" y="430" text-anchor="middle" class="label">Party API + Socket</text><text x="1265" y="448" text-anchor="middle" class="tiny">room · chat · member</text>
    <rect x="1370" y="405" width="170" height="56" class="api card"/><text x="1455" y="430" text-anchor="middle" class="label">Feed / Video API</text><text x="1455" y="448" text-anchor="middle" class="tiny">post · reaction · media</text>
    <rect x="1560" y="405" width="170" height="56" class="warn card"/><text x="1645" y="430" text-anchor="middle" class="label">Profile Social API</text><text x="1645" y="448" text-anchor="middle" class="small">404 production</text>
    <path d="M122 640 C122 690 695 690 695 461" class="lineSoft"/>
    <path d="M292 312 C292 360 885 360 885 405" class="line"/>
    <path d="M462 312 C462 360 1075 360 1075 405" class="line"/>
    <path d="M632 312 C632 360 1265 360 1265 405" class="line"/>
    <path d="M802 312 C802 360 1455 360 1455 405" class="line"/>
    <path d="M972 312 C972 365 1455 365 1455 405" class="lineSoft"/>
    <path d="M1142 312 C1142 360 1645 360 1645 405" class="lineRed"/>
    <path d="M1312 312 C1312 365 1455 365 1455 405" class="lineSoft"/>
    <path d="M1482 312 C1482 360 1455 360 1455 405" class="lineSoft"/>
  </g>

  <!-- Cross-screen flows -->
  <g>
    <rect x="610" y="515" width="235" height="80" class="screen card"/><text x="727" y="542" text-anchor="middle" class="label">Matching sessions</text><text x="727" y="561" text-anchor="middle" class="small">Soul / Voice → Friendship</text><text x="727" y="579" text-anchor="middle" class="tiny">→ Friends → Chat</text>
    <rect x="870" y="515" width="235" height="80" class="screen card"/><text x="987" y="542" text-anchor="middle" class="label">Party room</text><text x="987" y="561" text-anchor="middle" class="small">A create · B join</text><text x="987" y="579" text-anchor="middle" class="tiny">→ realtime chat / mic</text>
    <rect x="1130" y="515" width="235" height="80" class="screen card"/><text x="1247" y="542" text-anchor="middle" class="label">Movie / Palm</text><text x="1247" y="561" text-anchor="middle" class="small">two-account session</text><text x="1247" y="579" text-anchor="middle" class="tiny">→ state / result</text>
    <rect x="1390" y="515" width="340" height="80" class="warn card"/><text x="1560" y="542" text-anchor="middle" class="label">Profile action failure</text><text x="1560" y="561" text-anchor="middle" class="small">GET actions / follow / conversation → 404</text><text x="1560" y="579" text-anchor="middle" class="small">Follow + Nhắn tin bị disable</text>
    <path d="M1075 461 V515" class="line"/><path d="M1265 461 V515" class="line"/><path d="M1455 461 V515" class="line"/><path d="M1645 461 V515" class="lineRed"/>
  </g>

  <!-- Data / platform -->
  <text x="610" y="665" class="subtitle">DATA, REALTIME, PAYMENT &amp; OBSERVABILITY</text>
  <g>
    <rect x="610" y="690" width="230" height="62" class="data card"/><text x="725" y="718" text-anchor="middle" class="label">PostgreSQL + Redis</text><text x="725" y="738" text-anchor="middle" class="small">users · friends · tickets · rooms</text>
    <rect x="890" y="690" width="230" height="62" class="data card"/><text x="1005" y="718" text-anchor="middle" class="label">Socket.IO Signaling</text><text x="1005" y="738" text-anchor="middle" class="small">realtime events / chat</text>
    <rect x="1170" y="690" width="230" height="62" class="data card"/><text x="1285" y="718" text-anchor="middle" class="label">LiveKit Media</text><text x="1285" y="738" text-anchor="middle" class="small">voice / room / mic</text>
    <rect x="1450" y="690" width="230" height="62" class="data card"/><text x="1565" y="718" text-anchor="middle" class="label">Economy / Ledger</text><text x="1565" y="738" text-anchor="middle" class="small">Diamond · VIP · Gift</text>
    <path d="M695 461 V690" class="lineSoft"/><path d="M885 461 C885 570 725 570 725 690" class="lineSoft"/><path d="M1075 461 C1075 580 725 580 725 690" class="lineSoft"/><path d="M1265 461 C1265 580 1005 580 1005 690" class="lineSoft"/><path d="M1455 461 C1455 590 1565 590 1565 690" class="lineSoft"/><path d="M1645 461 C1645 620 725 620 725 690" class="lineRed"/>
  </g>

  <g>
    <rect x="610" y="820" width="230" height="62" class="infra card"/><text x="725" y="848" text-anchor="middle" class="label">Sentry</text><text x="725" y="868" text-anchor="middle" class="small">JS errors / API traces</text>
    <rect x="890" y="820" width="230" height="62" class="infra card"/><text x="1005" y="848" text-anchor="middle" class="label">Grafana Cloud OTLP</text><text x="1005" y="868" text-anchor="middle" class="small">metrics push trực tiếp</text>
    <rect x="1170" y="820" width="230" height="62" class="infra card"/><text x="1285" y="848" text-anchor="middle" class="label">Health endpoints</text><text x="1285" y="868" text-anchor="middle" class="small">health / live / ready</text>
    <rect x="1450" y="820" width="230" height="62" class="warn card"/><text x="1565" y="848" text-anchor="middle" class="label">/metrics</text><text x="1565" y="868" text-anchor="middle" class="small">404 — expected design</text>
    <path d="M725 752 V820" class="lineSoft"/><path d="M1005 752 V820" class="lineSoft"/><path d="M1285 752 V820" class="lineSoft"/><path d="M1565 752 V820" class="lineSoft"/>
  </g>

  <!-- Test summary -->
  <rect x="50" y="930" width="1680" height="190" rx="16" fill="#151f27" stroke="#2d383d"/>
  <text x="78" y="966" class="label">RUNTIME TEST SUMMARY</text>
  <text x="78" y="998" class="small">PASS: public routes · protected screens · Party A+B chat · Soul A+B join/session · Movie/Palm · Video media · Sentry</text>
  <text x="78" y="1026" class="small">FAIL: Profile Social production routes — /actions, /follow, /conversation trả 404</text>
  <text x="78" y="1054" class="small">EXPECTED: /metrics 404 · Nearby 403 khi chưa bật vị trí · Guest không đăng Feed</text>
  <text x="78" y="1082" class="small">PARTIAL: Voice call thật · payment/VIP thật · friend chat sau khi match · Feed/Video mutation đầy đủ</text>
  <text x="78" y="1108" class="tiny">Sơ đồ này mô tả luồng UI → API → data/realtime và các điểm đã kiểm tra, không phải deployment topology đầy đủ.</text>
</svg>
